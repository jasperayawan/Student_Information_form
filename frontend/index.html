<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Paulino Dari National High School</title>
    <link rel="icon" type="image/png" href="img/pdnhs-logo-64.png">
    <link rel="stylesheet" href="style.css?v=19">
</head>

<body>
    <!-- Sign in -->
    <div class="login-view" id="login-view" hidden>
        <div class="login-card">
            <div class="login-brand">
                <img class="brand-logo brand-logo-lg" src="img/pdnhs-logo-128.png" alt="" width="64" height="64">
                <span>Paulino Dari National High School</span>
            </div>
            <h1 id="login-title">Sign in</h1>
            <form id="login-form" class="form" aria-labelledby="login-title">
                <label class="field"><span>Username</span>
                    <input type="text" name="username" autocomplete="username" required>
                </label>
                <label class="field"><span>Password</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <p class="form-error" id="login-error" role="alert" hidden></p>
                <div class="dialog-actions">
                    <button id="btn" type="submit" class="btn btn-primary">Sign in</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application -->
    <div class="layout" id="app-view" hidden>
        <header class="appbar">
            <button type="button" class="icon-btn menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
            </button>
            <img class="brand-logo" src="img/pdnhs-logo-64.png" alt="" width="30" height="30">
            <span class="appbar-title">Paulino Dari National High School</span>
            <div class="account">
                <button type="button" class="avatar" id="account-button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button>
                <div class="menu" id="account-menu" role="menu" hidden>
                    <div class="menu-header">
                        <span class="avatar-img avatar-md" id="account-photo" aria-hidden="true"></span>
                        <span class="menu-identity">
                            <strong id="account-name"></strong>
                            <span id="account-username" class="muted"></span>
                            <span id="account-role" class="muted"></span>
                        </span>
                    </div>
                    <button type="button" role="menuitem" id="change-password">Change password</button>
                    <button type="button" role="menuitem" id="logout">Sign out</button>
                </div>
            </div>
        </header>
        <aside class="sidebar" id="sidebar">
            <nav id="nav" aria-label="Main navigation"></nav>
        </aside>
        <div class="scrim" id="scrim" hidden></div>
        <main class="content">
            <h1 id="page-title" class="page-title"></h1>
            <section id="page" class="page"></section>
        </main>
    </div>

    <div id="dialog-root"></div>
    <div id="toast-root" class="toasts" aria-live="polite"></div>

    <script src="./js/api.js?v=19"></script>
    <script src="./js/ui.js?v=19"></script>
    <script src="./js/pages/dashboard.js?v=19"></script>
    <script src="./js/pages/students.js?v=19"></script>
    <script src="./js/pages/instructors.js?v=19"></script>
    <script src="./js/pages/courses.js?v=19"></script>
    <script src="./js/pages/subjects.js?v=19"></script>
    <script src="./js/pages/scheduling.js?v=19"></script>
    <script src="./js/pages/classrooms.js?v=19"></script>
    <script src="./js/pages/enrollment.js?v=19"></script>
    <script src="./js/pages/users.js?v=19"></script>
    <script src="./js/pages/settings.js?v=19"></script>
    <script src="./index.js?v=19"></script>
</body>

</html>
